name: Build Speedy Arriba (Windows / Linux / Android)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SDL2 & snes9x_libretro (Windows x64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.8/SDL2-devel-2.30.8-VC.zip" -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath sdl2_ext
          $sdl = Get-ChildItem sdl2_ext -Directory | Select-Object -First 1
          Copy-Item "$($sdl.FullName)\lib\x64\SDL2.dll" .
          Copy-Item "$($sdl.FullName)\lib\x64\SDL2.lib" .
          Copy-Item "$($sdl.FullName)\include\*.h" src\win_sdl2\ -Force
          Invoke-WebRequest -Uri "https://buildbot.libretro.com/nightly/windows/x86_64/latest/snes9x_libretro.dll.zip" -OutFile snes9x.zip
          Expand-Archive snes9x.zip -DestinationPath .
      - name: Build Speedy.exe
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile
        run: cl /nologo /O2 /W3 /Isrc\win_sdl2 /D_CRT_SECURE_NO_WARNINGS src\speedy.c /Fe:Speedy.exe /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup SDL2.lib comdlg32.lib user32.lib shell32.lib
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\SpeedyArriba-Win64 | Out-Null
          Copy-Item Speedy.exe, SDL2.dll, snes9x_libretro.dll, LEEME.txt, README.md dist\SpeedyArriba-Win64\
          Compress-Archive -Path dist\SpeedyArriba-Win64\* -DestinationPath SpeedyArriba-Win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedyArriba-Win64
          path: SpeedyArriba-Win64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 & tools
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config curl unzip libfuse2
      - name: Download snes9x_libretro & appimagetool
        run: |
          curl -fL "https://buildbot.libretro.com/nightly/linux/x86_64/latest/snes9x_libretro.so.zip" -o snes9x.zip
          unzip -o snes9x.zip
          curl -fL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o /usr/local/bin/appimagetool || sudo curl -fL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 bash packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedyArriba-Linux-x86_64
          path: SpeedyArriba-x86_64.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download SDL2 source & snes9x Android cores
        run: |
          curl -fL "https://github.com/libsdl-org/SDL/releases/download/release-2.30.8/SDL2-2.30.8.tar.gz" -o sdl2.tar.gz
          tar xzf sdl2.tar.gz
          echo "SDL2_DIR=$PWD/SDL2-2.30.8" >> $GITHUB_ENV
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          curl -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip" -o arm64.zip
          unzip -o arm64.zip -d android/app/src/main/jniLibs/arm64-v8a
          mv android/app/src/main/jniLibs/arm64-v8a/snes9x_libretro_android.so android/app/src/main/jniLibs/arm64-v8a/libsnes9x_libretro.so
          curl -fL "https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/snes9x_libretro_android.so.zip" -o armv7.zip
          unzip -o armv7.zip -d android/app/src/main/jniLibs/armeabi-v7a
          mv android/app/src/main/jniLibs/armeabi-v7a/snes9x_libretro_android.so android/app/src/main/jniLibs/armeabi-v7a/libsnes9x_libretro.so
      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease -PSDL2_DIR="$SDL2_DIR"
          cp app/build/outputs/apk/release/app-release.apk ../SpeedyArriba-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedyArriba-Android
          path: SpeedyArriba-Android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, linux, android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SpeedyArriba-Win64/SpeedyArriba-Win64.zip
            artifacts/SpeedyArriba-Linux-x86_64/SpeedyArriba-x86_64.AppImage
            artifacts/SpeedyArriba-Android/SpeedyArriba-Android.apk
